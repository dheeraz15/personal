baseURL = "https://dhirajchapagain.com.np/"
locale = "en-us"
title = "Dhiraj Chapagain"
enableRobotsTXT = true
enableEmoji = true
summaryLength = 30

[pagination]
  pagerSize = 30

[params]
  description = "Product manager writing about people, process and products at scale."
  author = "Dhiraj Chapagain"

  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/underhade/"
  [[params.social]]
    name = "Medium"
    url = "https://medium.com/@underhade"

[menus]
  [[menus.main]]
    name = "Essays"
    pageRef = "/essays"
    weight = 10
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 20

[taxonomies]

[markup]
  [markup.highlight]
    noClasses = false
    style = "base16-snazzy"
  [markup.goldmark.renderer]
    unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[services.rss]
  limit = 30
