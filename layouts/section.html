{{ define "main" }}
  <div class="article-head">
    <h1 class="article-title">{{ .Title }}</h1>
    {{- with .Content }}<div class="intro">{{ . }}</div>{{ end }}
  </div>

  {{- with .RegularPages }}
    {{ partial "log.html" . }}
  {{- else }}
    <p class="intro">Nothing here yet.</p>
  {{- end }}
{{ end }}
