<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
  {{ partial "head.html" . }}
  <body{{ if .IsHome }} class="is-home"{{ end }}>
    <a class="skip" href="#main">Skip to content</a>
    {{ partial "masthead.html" . }}
    <main id="main" class="shell">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
