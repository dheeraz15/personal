<header class="shell masthead">
  <a class="masthead-name" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <nav class="masthead-nav" aria-label="Primary">
    {{- range site.Menus.main }}
      {{- $active := or ($.IsDescendant .Page) (eq $.RelPermalink .URL) }}
      <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
    <button
      type="button"
      class="theme-toggle"
      data-theme-toggle
      aria-pressed="false"
      title="Switch to light"
    >
      <span class="visually-hidden">Switch theme</span>
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M20 13.2A8.2 8.2 0 1 1 10.8 4a6.6 6.6 0 0 0 9.2 9.2Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
      </svg>
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path
          d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </nav>
</header>
